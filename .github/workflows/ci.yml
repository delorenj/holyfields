name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Schemas, generated packages, and drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: pip install --upgrade pip uv

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv sync --all-groups --all-packages
          bun install --frozen-lockfile

      - name: Validate JSON Schemas
        run: uv run bash scripts/validate_schemas.sh

      - name: Generate committed artifacts
        run: |
          uv run python tools/generators/generate_pydantic.py
          bash scripts/generate_typescript.sh

      - name: Check generated drift
        run: |
          if ! git diff --exit-code -- packages/python/src/holyfields/generated packages/python/src/holyfields/schemas packages/typescript/src/generated; then
            echo "Generated artifacts are out of sync. Run: mise run generate:all"
            exit 1
          fi

      - name: Typecheck Python
        run: uv run mypy packages/python/src/holyfields tools/generators

      - name: Typecheck TypeScript
        run: cd packages/typescript && bun run typecheck

      - name: Test Python
        run: uv run --package holyfields pytest packages/python/tests

      - name: Test TypeScript
        run: cd packages/typescript && bun test

      - name: Build Python package
        run: uv build --package holyfields

      - name: Build TypeScript package
        run: cd packages/typescript && bun pm pack
