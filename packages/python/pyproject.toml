[project]
name = "holyfields"
version = "0.1.0"
description = "Python contracts generated from the Holyfields JSON Schema registry"
authors = [{ name = "Jarad DeLorenzo" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holyfields"]
