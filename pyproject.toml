[project]
name = "holyfields-workspace"
version = "0.1.0"
description = "Workspace orchestration for Holyfields contract packages"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "build>=1.2.2",
    "hatchling>=1.25.0",
    "jsonschema>=4.20.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/python/src", "packages/python/tests", "tools/generators"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["packages/python/src"]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]
python_files = "test_*.py"
addopts = "-v"
